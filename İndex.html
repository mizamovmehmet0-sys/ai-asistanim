
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRAT</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 22px;
  text-align: center;
  background: #19243a;
  font-size: 23px;
  font-weight: bold;
}
main {
  padding: 20px;
  text-align: center;
}
.robot {
  font-size: 65px;
  margin-top: 65px;
}
h2 { color: #66c8ff; }
p { color: #c4ccda; }
#messages {
  text-align: left;
  margin-top: 30px;
}
.message {
  background: #202d43;
  padding: 13px;
  border-radius: 12px;
  margin: 10px 0;
}
footer {
  position: fixed;
  bottom: 15px;
  left: 10px;
  right: 10px;
  display: flex;
  gap: 8px;
}
input {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #26344c;
  color: white;
  min-width: 0;
}
button {
  border: none;
  border-radius: 12px;
  padding: 12px;
  background: #168cff;
  color: white;
}
</style>
</head>
<body>

<header>🤖 BRAT </header>

<main>
<div class="robot">🤖</div>
<h2>Merhaba!</h2>
<p>Ben senin kişisel yapay zekâ asistanınım.</p>
<p>Nasıl yardımcı olabilirim?</p>
<div id="messages"></div>
</main>

<footer>
<input id="question" placeholder="Bir şeyler yaz...">
<button onclick="sendMessage()">Gönder</button>
</footer>

<script>
function sendMessage() {
  const input = document.getElementById("question");
  const messages = document.getElementById("messages");
  const value = input.value.trim();

  if (!value) return;

  const msg = document.createElement("div");
  msg.className = "message";
  msg.textContent = "Sen: " + value;
  messages.appendChild(msg);

  input.value = "";
}
</script>

</body>
</html>
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"
<title>Brat </title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101522;
  color: white;
}

header {
  background: #19243a;
  padding: 20px;
  text-align: center;
  font-size: 23px;
  font-weight: bold;
  color: #49baff;
}

#chat {
  height: 70vh;
  overflow-y: auto;
  padding: 15px;
}

.message {
  padding: 13px;
  margin: 12px 0;
  border-radius: 12px;
  max-width: 85%;
  line-height: 1.5;
}

.user {
  background: #1769aa;
  margin-left: auto;
}

.bot {
  background: #29364d;
  margin-right: auto;
}

.controls {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #19243a;
  padding: 12px;
  display: flex;
  gap: 7px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border-radius: 10px;
  border: none;
  outline: none;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px;
  background: #168be0;
  color: white;
  font-size: 17px;
}

button:active {
  background: #075a99;
}
</style>
</head>

<body>

<header>🤖 BRAT </header>

<div id="chat">
  <div class="message bot">
    Merhaba! Ben senin yapay zekâ asistanınım.
    Bana mesaj yazabilir veya mikrofonla konuşabilirsin. 😊
  </div>
</div>

<div class="controls">
  <input id="message" placeholder="Bir şey sor...">
  <button onclick="sendMessage()">➤</button>
  <button onclick="speak()">🎤</button>
</div>

<script>
const chat = document.getElementById("chat");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById("message");
  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  setTimeout(() => {
    addMessage(
      "Mesajını aldım! Gerçek yapay zekâ bağlantısı henüz kurulmadı. Bir sonraki aşamada bunu ekleyeceğiz.",
      "bot"
    );
  }, 500);
}

function speak() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    alert("Tarayıcın sesli konuşmayı desteklemiyor.");
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "tr-TR";
  recognition.start();

  recognition.onresult = function(event) {
    document.getElementById("message").value =
      event.results[0][0].transcript;
    sendMessage();
  };
}

document.getElementById("message")
.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});
</script>

</body>
</html>
